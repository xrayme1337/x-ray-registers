name: Update samples

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the sample files from x-ray.me
        run: |
          set -euo pipefail
          mkdir -p data tmp
          failed=0
          total=0
          while read -r key; do
            [ -n "$key" ] || continue
            total=$((total + 1))
            # A sample file opens with a UTF-8 byte order mark and its "# " head: anything else is no sample.
            if curl -fsS --retry 3 --retry-delay 5 --max-time 60 \
                 -A "x-ray-registers/1.0 (+https://github.com/xrayme1337/x-ray-registers)" \
                 "https://x-ray.me/registers/$key.csv" -o "tmp/$key.csv" \
               && head -c 5 "tmp/$key.csv" | grep -q "# "; then
              mv "tmp/$key.csv" "data/$key.csv"
            else
              echo "::warning::$key was not read; the stored file stays"
              failed=$((failed + 1))
            fi
            sleep 1
          done < lists.txt
          rm -rf tmp
          echo "read $((total - failed)) of $total lists"
          [ "$((failed * 2))" -lt "$total" ] || { echo "half of the lists or more were not read"; exit 1; }
      - name: Commit what changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "Update samples: $(date -u +%F)"
            git push
          fi
